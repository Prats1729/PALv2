name: Automated Release (Desktop & Android)

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'android/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'capacitor.config.json'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  release-desktop:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Auto-increment patch version for OTA
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: node scripts/bump-version.js

      - name: Prepare Clean Signing Key
        shell: bash
        run: |
          CLEAN_KEY=$(printf '%s' "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" | tr -d '\r\n ')
          echo "TAURI_SIGNING_PRIVATE_KEY=$CLEAN_KEY" >> $GITHUB_ENV

      - name: Build Tauri App & Publish GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'PAL v__VERSION__'
          releaseBody: 'Automated release for commit ${{ github.sha }}. Desktop installer and Android APK builds attached.'
          releaseDraft: false
          prerelease: false

  release-android:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: release-desktop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install frontend dependencies
        run: npm install

      - name: Sync release version
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: node scripts/bump-version.js

      - name: Get Release Version Tag
        id: get_tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Frontend Web Assets
        run: npm run build

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Prepare Release Artifact
        id: prepare_apk
        run: |
          RELEASE_APK="android/app/build/outputs/apk/release/app-release.apk"
          TARGET_APK="android/app/build/outputs/apk/release/PAL-${{ steps.get_tag.outputs.version }}.apk"
          cp "$RELEASE_APK" "$TARGET_APK"
          echo "apk_path=$TARGET_APK" >> $GITHUB_OUTPUT

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          files: ${{ steps.prepare_apk.outputs.apk_path }}
